# LibRaw 0.22.0's model alias groups (`GetNormalizedModel`, src/metadata/
# normalize_model.cpp): the marketing names a file's model string may carry
# besides the engine's canonical colour-table name, by maker. Samsung's
# `strstr` rewrites come first for that maker; each `target` then replaces
# every name in its `aliases` (a model already equal to the `name` stays).
# Written to match normalize_model.cpp entry for entry, including one
# missing-comma quirk that joins "DC-ZS220D" and "DC-TX2" into one literal.
# The Canon, Sony and Kodak branches key off body ids instead of names and
# resolve to the names their files already record, so they have no entries.

